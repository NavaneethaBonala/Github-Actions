name: AWS-OIDC-Configure-StaticWeb-S3Bucket
on : 
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: OIDC AWS configure
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ap-south-1
